# Mantic "Crucible" (https://competitions.mantic.com) is a bot-only forecasting competition
# run on a fork of the open-source Metaculus platform, so the bot's whole pipeline runs
# unchanged behind `--mode mantic` with the platform client swapped (metaculus_bot/mantic.py;
# design in docs/operations.md "Mantic"). It forecasts the tournament named by
# MANTIC_TOURNAMENT_ID in constants.py.
#
# Personal keys ONLY. Metaculus donates its OpenRouter key for its own tournaments, so this
# workflow never receives that secret (tests/test_workflow_reliability.py pins its absence
# from this file's raw text, so do not name it even in a comment) and forces both
# donated-routing flags off; cli refuses to start a Mantic run while
# DONATED_OPENROUTER_KEY_ENABLED still reads true. There is no Metaculus token here either:
# a Mantic run must not depend on Metaculus at all.
# Consequence: with a single OpenRouter key there is no key-swap fallback, so a personal-key
# 401/402/429 is a hard failure of the question by design.
#
# Merging this file to main auto-enables the schedule: GitHub runs a new scheduled workflow
# as soon as its file is on the default branch, unless someone disables it in the Actions
# UI. The MANTIC_TOKEN repository secret is set; the remaining operator steps (one paid
# per-bin smoke on post 651, then the merge) are listed in docs/operations.md "Running it,
# and what is left for the operator". Every run spends the personal OpenRouter and research
# keys (about $3 per question; the post-650 smoke spent $3.17) and publishes to Mantic.
name: Forecast on Mantic tournament

on:
  workflow_dispatch:
  schedule:
    # Three entries, all early in the hour. Mantic questions open on the hour with 60-minute
    # windows, so a pickup after about :30 gets only the degraded fast path and one in the
    # last six minutes gets nothing, and GitHub delivers only about a fifth of this
    # repository's scheduled firings, so one entry is not enough. The minutes sit off every
    # other bot workflow's entries (a shared minute starts two full runs at once; the pin is
    # in tests/test_workflow_reliability.py) and off the :00 scheduling burst. The delivery
    # numbers and the external-dispatcher fix: docs/operations.md "Scheduling reliability".
    # Make sure to skip already forecasted questions!
    - cron: "5 * * * *" # every hour at :05
    - cron: "15 * * * *" # every hour at :15
    - cron: "25 * * * *" # every hour at :25

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Hourly job to run the forecast bot against the Mantic tournament
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # Backstop only; the per-step caps below are the real hang defense. Sized above the
    # bot's OWN contract rather than off the measured distribution: constants.py caps a
    # question at PER_QUESTION_WALL_CLOCK_DEADLINE (3510s) and reserves
    # WALL_CLOCK_STACKING_MIN_BUDGET (90s) to publish (a 3600s cycle), and questions
    # run concurrently (forecasting-tools gathers them), so 60 min is the longest a
    # healthy run may legitimately need whatever it picked up. 80 = that 60 + the
    # Playwright cap + setup + upload + margin. A cap at or below 60 would kill a
    # slow-but-recovering run in the second it was about to publish, which is the
    # forfeit we are trying to prevent. Worst job measured in the era: 11.3 min.
    timeout-minutes: 80
    steps: # sets up the steps that will be run in order
      # Every step below carries its own timeout-minutes. The job cap is the wrong
      # instrument for a hang: it fires late, it reports `cancelled` (indistinguishable
      # from a concurrency eviction, which is how 2026-08-19's four wedges hid among the
      # day's 54 evictions), and it cannot let a run continue past a step that is
      # allowed to fail. Caps run 5x-100x the worst of 200 successful runs (checkout 4s,
      # setup-uv 3s, uv sync 22s, Playwright 55s, upload 2s), so none can fire on a
      # healthy run. Receipts: scratch/residual_2026-08-24/track_c_step_timings.json.
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --no-dev --frozen
      # Chromium for gap-fill v2's rendered-fetch rung (playwright). --with-deps
      # pulls the system libraries chromium needs on ubuntu runners. The loop
      # degrades to plain fetch if the browser is missing, so this step is
      # belt-and-suspenders rather than run-critical.
      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        # 2026-08-19: apt hung here on four runs after the Azure Ubuntu mirror failed
        # over, each burning the full 300-min job cap while holding the concurrency
        # group (18 of 24 hours; q45374 and q45375 forfeited). A kill costs nothing:
        # the run proceeds with the rendered-fetch rung degraded to plain fetch, which
        # is what continue-on-error already intends. 5 min is 5.5x the worst of 200
        # healthy runs (55s, p50 24s); the 3 min shipped in 41ee30f was sized off an
        # n=10 sample whose 34s max missed that tail.
        timeout-minutes: 5
        run: uv run --frozen --no-dev playwright install --with-deps chromium
      - name: Warn if Playwright install failed
        # No cap: a bash echo with no network and no subprocess cannot hang.
        if: steps.playwright_install.outcome == 'failure'
        run: echo "::warning title=Playwright install failed::Chromium install failed. The gap-fill v2 rendered-fetch rung will degrade to plain fetch this run. Transient apt/CDN blips are common; investigate only if this recurs."
      - name: Run bot
        shell: bash
        # Repo is public, so uploaded artifacts are effectively public. Log content
        # (question URLs, predictions, degradation counters) is the same class of
        # content the Metaculus workflows already expose: acceptable, no redaction.
        # A secret-leakage audit passed: no logger emits credentials; keys travel only
        # in request headers.
        # shell: bash yields `set -eo pipefail`, so the `python | tee` pipeline
        # preserves the intentional sys.exit(1) degradation alert (cli.py ~L186);
        # a bare `run:` (bash -e, no pipefail) would swallow it as tee's exit 0.
        # Cap at the bot's own contract (see the job cap above): 60 min is the longest
        # a healthy run may legitimately need, and 70 leaves headroom for the question
        # fetch, the identity preflight and the publish retries. A kill here FAILS the
        # step rather than cancelling the job, so the always() upload below still ships
        # the partial log (the observability the 2026-08-06 streak had none of).
        timeout-minutes: 70
        run: |
          mkdir -p run_logs
          uv run --frozen --no-dev python main.py --mode mantic 2>&1 | tee "run_logs/run_${GITHUB_RUN_ID}_$(date -u +%Y%m%dT%H%M%SZ).log"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # Unbuffered stdout/stderr so log lines stream in real time and nothing
          # is lost if the run crashes before a buffer flush.
          PYTHONUNBUFFERED: '1'
          # The bot's personal Mantic token (bot user nostreambot-bot). The only platform
          # credential in this workflow; there is deliberately no Metaculus token.
          MANTIC_TOKEN: ${{ secrets.MANTIC_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Exa semantic search (gap-fill v2's search_web tool; also the legacy
          # SmartSearcher fallback path). Secret name is lowercase exa_key
          # (funded 2026-07-16).
          EXA_API_KEY: ${{ secrets.exa_key }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The ONE OpenRouter key here: the operator's personal key. The
          # Metaculus-donated key is deliberately not wired (see the header comment),
          # and the master switch below makes cli fail shut if a future edit re-enables
          # donated routing without also re-adding the secret.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DONATED_OPENROUTER_KEY_ENABLED: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_MAX_CONCURRENCY: '1'
          ASKNEWS_MAX_RPS: '0.2'
          # Disable litellm's aiohttp transport (default since v1.71.x): under
          # concurrent async bursts it raises near-instant connection failures
          # litellm re-wraps as a 1ms Timeout (litellm #14895; see
          # scratch_docs_and_planning/transient_retry_fix.md). Code already sets
          # this default in metaculus_bot/__init__.py; pinned here for parity.
          DISABLE_AIOHTTP_TRANSPORT: 'true'
          # Native search runs in parallel with AskNews; model defaults to
          # openai/gpt-6-sol (low effort, verbosity=low, 360s) per constants.py.
          NATIVE_SEARCH_ENABLED: 'true'
          FINANCIAL_DATA_ENABLED: 'true'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # SEC EDGAR fair-access contact: the User-Agent the EDGAR client sends. Unset, the
          # client declines and the fetch ladder falls through to the ordinary page fetch.
          SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}
          # Gemini grounded search (Google AI Studio SDK) adds a 3rd distinct source.
          # GOOGLE_API_KEY is the operator's personal Google AI Studio key (stored
          # in CI as secrets.GEMINI_API_KEY). The grounded-search side has no
          # donated/shared path, because Google AI Studio doesn't offer one.
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH_ENABLED: 'true'
          # OpenRouter Gemini routing (forecaster, stacker, summarizer when the
          # ensemble includes a Google model). The Metaculus workflows set this
          # 'true' so Gemini prefers the donated key; here it is 'false' so every
          # Gemini call goes straight to the personal OPENROUTER_API_KEY. Redundant
          # with the master switch above, kept explicit so the file reads as what it is.
          GEMINI_USE_DONATED_OPENROUTER_KEY: 'false'
          # Second-pass gap-fill: analyzer identifies gaps in first-pass research,
          # parallel grounded Gemini searches resolve each. Fails soft.
          GAP_FILL_ENABLED: 'true'
          # Agentic gap-fill v2 (bounded research loop; runs concurrently with
          # v1 when both are on). ON since 2026-07-17 after smoke + blind driver
          # eval + Exa confirmation; v1 stays on for an overlap window.
          GAP_FILL_V2_ENABLED: 'true'
          # Probabilistic tools post-processor: deterministic probability math
          # injected into per-forecaster rationales and the stacker's view.
          # Retired (C2): tier-2 scaffold fields no longer demanded in prompts;
          # tool_runner stays dormant behind this flag. Re-enable if future
          # benchmarks show value from structured-declaration math.
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          PROBABILISTIC_TOOLS_TYPES: 'binary,multiple_choice'
          # Prediction-market snapshot provider: queries Polymarket, Kalshi,
          # Manifold concurrently and aggregates into research blurb. Hard-
          # disabled under is_benchmarking=True to prevent backtest leakage
          # (the prod path is_benchmarking=False, so this fires here).
          PREDICTION_MARKETS_ENABLED: 'true'
          # Cited-source fetcher; long HTML uses the paid page-digest extractor.
          # Validated via live test_bot run 2026-07-10.
          RESOLUTION_SOURCE_ENABLED: 'true'
          # The ladder's one PAID rung: when every free rung has failed to read a
          # cited page, Gemini's url_context reader is asked to read it, billed to
          # GOOGLE_API_KEY above. ON since 2026-09-04. Bounded by the free
          # Google-Extended robots pre-check, the rung's wall-budget floor and
          # RESOLUTION_SOURCE_URL_CONTEXT_MAX_ATTEMPTS paid reads per question.
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'true'
          # Time-series anchor: deterministic empirical P10/P50/P90 band from a
          # question's own resolution series (FRED/yfinance). Text anchor ON since
          # 2026-07-17 (post smoke validation; see FUTURE.md "Time-series anchor").
          TS_ANCHOR_ENABLED: 'true'
          # TS anchor chart image side-channel (vision message to base models).
          # OFF pending the text-vs-image A/B (see FUTURE.md "TS anchor chart image").
          TS_ANCHOR_CHART_ENABLED: 'false'
          # Disable stacking on all types. n=88 ablation: stacker hurts numeric CRPS
          # and is <= median on binary; 2026-05-29 peer recompute found the stacker's
          # own model (claude-opus-4.5) is one of the weakest base binary forecasters.
          NUMERIC_STACKING_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          # Suppress openai-agents trace-export background thread (unused).
          OPENAI_AGENTS_DISABLE_TRACING: 'true'
          # Persist research outputs as JSONL for offline backtest replay. Mantic
          # records carry tournament_id=MANTIC_TOURNAMENT_ID and platform=mantic.
          PERSIST_RESEARCH_ENABLED: 'true'
          # Raw research-provider payload log: each provider's RAW return (AskNews
          # article dicts per phase, native/Gemini raw responses + grounding, market
          # contracts, resolution-source fetches, gap-fill results) →
          # run_logs/raw_research_<run_id>.jsonl, uploaded in this artifact. The
          # durable raw evidence behind each forecast (independent of published
          # comments); make sync_raw_research archives it.
          RAW_RESEARCH_LOG_ENABLED: 'true'
      - name: Upload research outputs
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          # Same research- prefix as the Metaculus workflows, so make sync_all harvests
          # Mantic runs into the archive too.
          name: research-${{ github.run_id }}
          path: |
            research_outputs/
            run_logs/
          retention-days: 90
          if-no-files-found: ignore
